[package]
name = "energy-monitor"
version = "0.1.0"
edition = "2024"

[features]
default = ["file-output", "subtract-idle"]
file-output = ["dep:egui-file-dialog"]
subtract-idle = []
remote-x11 = []

[profile.release]
opt-level = "s"
strip = "debuginfo"
lto = "thin"
panic = "abort"
codegen-units = 1

[dependencies]
eframe = "0.34.3"
egui-file-dialog = { version = "0.13.0", optional = true }
egui_plot = "0.35.0"
rapl-energy = "0.2.2"
